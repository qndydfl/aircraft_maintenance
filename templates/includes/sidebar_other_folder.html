<details class="sidebar-tree-folder"{% if folder.is_open %} open{% endif %}>
    <summary class="sidebar-tree-folder-summary{% if folder.is_active %} active{% endif %}"{% if folder.is_active %} aria-current="page"{% endif %}>
        <i class="bi bi-folder2" aria-hidden="true"></i>
        <span>{{ folder.label }}</span>
        <small title="{{ folder.count }} file(s)">{{ folder.count }}</small>
        <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </summary>
    <div class="sidebar-tree-folder-children">
        <a href="{{ folder.url }}" class="sidebar-tree-link sidebar-tree-open-folder sidebar-tree-overview{% if folder.is_active %} active{% endif %}">
            <span>Overview</span>
        </a>
        {% for child_folder in folder.folders %}
            {% include 'includes/sidebar_other_folder.html' with folder=child_folder only %}
        {% endfor %}
        {% for file in folder.files %}
        <a href="{{ file.url }}" class="sidebar-tree-link sidebar-tree-file-link{% if file.is_active %} active{% endif %}" title="{{ file.label }}"{% if file.is_active %} aria-current="page"{% endif %}>
            <i class="bi bi-file-earmark" aria-hidden="true"></i>
            <span>{{ file.label }}</span>
            <small title="{{ file.count }} file">{{ file.count }}</small>
        </a>
        {% endfor %}
    </div>
</details>
